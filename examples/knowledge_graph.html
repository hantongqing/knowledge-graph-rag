al Problem of Proof refers to the question of whether all mathematical descriptions are provable, or if there exists a method that can confirm a given mathematical description as true.\"", "entity_type": "\"CONCEPT\"", "id": "\"THEORETICAL PROBLEM OF PROOF\"", "label": "\"THEORETICAL PROBLEM OF PROOF\"", "shape": "dot", "size": 10, "source_id": "chunk-fe7877e812a1accabae627f6a83e0436"}, {"color": "#002aeb", "description": "\"An electronic device that can store, process, and communicate information.\"\u003cSEP\u003e\"Computer can be thought of as a machine without consciousness, but this view is challenged by Nagler\u0027s theory.\"\u003cSEP\u003e\"The Computer is a device that can process information and perform tasks, but its ability to understand is challenged by the Chinese Room argument.\"\u003cSEP\u003e\"Turing invented computers by chance and made significant contributions to their development.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"COMPUTER\"", "label": "\"COMPUTER\"", "shape": "dot", "size": 10, "source_id": "chunk-1462ce87d0d57a8202cf8720f90fd7a5\u003cSEP\u003echunk-ccdb81e5a3ac20a0641ed6a926bd904c\u003cSEP\u003echunk-fe7877e812a1accabae627f6a83e0436\u003cSEP\u003echunk-e66b344430c8ac588c582f049b2e59af"}, {"color": "#fdc1c4", "description": "\"Mathematics is a broad field of study that encompasses various branches, including number theory, algebra, and geometry.\"\u003cSEP\u003e\"The study of numbers, quantities, and shapes.\"", "entity_type": "\"CONCEPT\"", "id": "\"MATHEMATICS\"", "label": "\"MATHEMATICS\"", "shape": "dot", "size": 10, "source_id": "chunk-fe7877e812a1accabae627f6a83e0436\u003cSEP\u003echunk-e66b344430c8ac588c582f049b2e59af"}, {"color": "#ee95a3", "description": "\"Number Theory is a branch of mathematics concerned with the properties and behavior of integers and other whole numbers.\"", "entity_type": "\"MATHEMATICAL FIELD\"", "id": "\"NUMBER THEORY\"", "label": "\"NUMBER THEORY\"", "shape": "dot", "size": 10, "source_id": "chunk-f nt of artificial intelligence and neural networks in the past.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"NYT\"", "label": "\"NYT\"", "shape": "dot", "size": 10, "source_id": "chunk-04080a56c7381ee2b6b204e6dd9fd7c7"}, {"color": "#34755c", "description": "\"1958 was the year when an article about artificial intelligence was published in The New York Times.\"", "entity_type": "\"EVENT\"", "id": "\"1958 \"", "label": "\"1958 \"", "shape": "dot", "size": 10, "source_id": "chunk-04080a56c7381ee2b6b204e6dd9fd7c7"}, {"color": "#7b65ac", "description": "\"1971 was the year when Rosenblatt passed away, which led to a decline in research on artificial intelligence and neural networks.\"", "entity_type": "\"EVENT\"", "id": "\"1971\"", "label": "\"1971\"", "shape": "dot", "size": 10, "source_id": "chunk-04080a56c7381ee2b6b204e6dd9fd7c7"}, {"color": "#df26b9", "description": "\"The 1960s were the decade when research on artificial intelligence and neural networks declined due to various reasons.\"", "entity_type": "\"EVENT\"", "id": "\"1960S\"", "label": "\"1960S\"", "shape": "dot", "size": 10, "source_id": "chunk-04080a56c7381ee2b6b204e6dd9fd7c7"}, {"color": "#b5c879", "description": "\"PDP stands for Parallel Distributed Processing, which is a research field that focuses on developing computational models that can parallelize tasks and distribute processing across multiple nodes.\"", "entity_type": "\"CONCEPT\"", "id": "\"PDP\"", "label": "\"PDP\"", "shape": "dot", "size": 10, "source_id": "chunk-04080a56c7381ee2b6b204e6dd9fd7c7"}, {"color": "#f76f69", "description": "\"Reverse Propagation is an algorithm used in PDP to train neural networks by adjusting the weights of connections between neurons based on the error gradient.\"", "entity_type": "\"ALGORITHM\"", "id": "\"REVERSE PROPAGATION\"", "label": "\"REVERSE PROPAGATION\"", "shape": "dot", "size": 10, "source_id": "chunk-04080a56c7381ee2b6b204e6dd9fd7c7"}, {"color": "#700445", "description": "\"Backpropagation is a va nk-c625cb579e9085c2cf23c00585d1a3dd"}, {"color": "#914efe", "description": "\"AI Safety refers to the development of technologies, guidelines, and practices aimed at ensuring that artificial intelligence systems are developed and used in ways that minimize harm to humans and society.\"", "entity_type": "\"CONCEPT\"", "id": "\"AI SAFETY\"", "label": "\"AI SAFETY\"", "shape": "dot", "size": 10, "source_id": "chunk-c625cb579e9085c2cf23c00585d1a3dd"}, {"color": "#f1af01", "description": "\"Value Alignment refers to the process of aligning an AI system\u0027s goals and values with those of human society, in order to ensure that the AI system is acting in ways that are beneficial and desirable for humans.\"", "entity_type": "\"CONCEPT\"", "id": "\"VALUE ALIGNMENT\"", "label": "\"VALUE ALIGNMENT\"", "shape": "dot", "size": 10, "source_id": "chunk-c625cb579e9085c2cf23c00585d1a3dd"}, {"color": "#804698", "description": "\"Nick Bostrom is a philosopher and director of the Future of Humanity Institute at Oxford University, known for his work on the ethics and risks associated with advanced artificial intelligence.\"", "entity_type": "\"PERSON\"", "id": "\" NICK BOSTROM\"", "label": "\" NICK BOSTROM\"", "shape": "dot", "size": 10, "source_id": "chunk-c625cb579e9085c2cf23c00585d1a3dd"}, {"color": "#4ec5d3", "description": "\"Superintelligence: Paths, Dangers, Strategies\" is a 2014 book by Nick Bostrom that explores the potential risks and benefits of advanced artificial intelligence.\"", "entity_type": "\"BOOK\"", "id": "\"NICK BOSTROM\u0027S SUPERINTELLIGENCE\"", "label": "\"NICK BOSTROM\u0027S SUPERINTELLIGENCE\"", "shape": "dot", "size": 10, "source_id": "chunk-c625cb579e9085c2cf23c00585d1a3dd"}, {"color": "#bf0df4", "description": "\"A supreme court decision refers to a ruling made by a country\u0027s highest court on a matter of law or policy, often with significant implications for society and individuals.\"", "entity_type": "\"EVENT\"", "id": "\"SUPREME COURT DECISION\"", "label": "\"SUPREME COURT DECISION\"", "shape": "dot", "size": 10, "source_id": "chunk-c625cb579e9085c2cf23c00585d1a3dd"}, {"color": "#c332e3", "description": "\"Research Scientist is an individual who conducts scientific research, often in academia or industry, aiming to advance knowledge and understanding in their field.\"", "entity_type": "\"PERSON\"", "id": "\"RESEARCH SCIENTIST \"", "label": "\"RESEARCH SCIENTIST \"", "shape": "dot", "size": 10, "source_id": "chunk-c625cb579e9085c2cf23c00585d1a3dd"}, {"color": "#324952", "description": "\"Academic Institution refers to a place of learning that awards degrees and provides education, such as universities or colleges.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"ACADEMIC INSTITUTION \"", "label": "\"ACADEMIC INSTITUTION \"", "shape": "dot", "size": 10, "source_id": "chunk-c625cb579e9085c2cf23c00585d1a3dd"}, {"color": "#d42a2f", "description": "\"Automation refers to the use of technology to perform tasks that would typically be done by humans, and is discussed in the context of job displacement.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"AUTOMATION\"", "label": "\"AUTOMATION\"", "shape": "dot", "size": 10, "source_id": "chunk-408604aef7a87f729ef7cafb725d120f"}, {"color": "#713256", "description": "\"Globalization is a process that continues to shape the world economy and society, bringing both opportunities and challenges.\"\u003cSEP\u003e\"Globalization refers to the increasing interconnectedness and interdependence among countries and regions, which affects traditional industries.\"", "entity_type": "\"GEO/EVENT\"", "id": "\"GLOBALIZATION\"", "label": "\"GLOBALIZATION\"", "shape": "dot", "size": 10, "source_id": "chunk-408604aef7a87f729ef7cafb725d120f\u003cSEP\u003echunk-f6066b9dc091e751ddd3b108ba9881b4"}, {"color": "#97a6ec", "description": "\"Louder refers to a social movement that emerged in the 19th century, characterized by protests against industrialization and automation.\"", "entity_type": "\"CONCEPT\"", "id": "\"LOUDER\"", "label": "\"LOUDER\"", "shape": "dot", "size": 10, "source_id": "chunk-408604aef7a87f729ef7cafb725d120f"}, {"color": "#39f8ee", "description": "\"Luddites were a group of workers who protested against the introduction of new technologies, including textile machines.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"LUDDITES\"", "label": "\"LUDDITES\"", "shape": "dot", "size": 10, "source_id": "chunk-408604aef7a87f729ef7cafb725d120f"}, {"color": "#4e62ab", "description": "\"The Industrial Revolution was a significant historical event that transformed the way goods were produced and distributed.\"", "entity_type": "\"EVENT\"", "id": "\"INDUSTRIAL REVOLUTION\"", "label": "\"INDUSTRIAL REVOLUTION\"", "shape": "dot", "size": 10, "source_id": "chunk-408604aef7a87f729ef7cafb725d120f"}, {"color": "#267d9c", "description": "\"Artificial Intelligence is a technology that has been developed to automate tasks and improve efficiency, but it also raises concerns about job displacement and loss of human connection.\"", "entity_type": "\"TECHNOLOGY\"", "id": "\"AI)", "label": "\"AI)", "shape": "dot", "size": 10, "source_id": "chunk-d755fab09b5a7aa586cb34ff284a4bed"}, {"color": "#679c05", "description": "\"Karl Marx was a philosopher and economist who wrote about the concept of alienation in his work.\"", "entity_type": "\"PERSON\"", "id": "\"KARL MARX\"", "label": "\"KARL MARX\"", "shape": "dot", "size": 10, "source_id": "chunk-d755fab09b5a7aa586cb34ff284a4bed"}, {"color": "#b1fece", "description": "\"The Communist Manifesto is a key work by Karl Marx that outlines his ideas on communism and alienation.\"", "entity_type": "\"EVENT\"", "id": "\"\u5171\u4ea7\u515a\u5ba3\u8a00\"", "label": "\"\u5171\u4ea7\u515a\u5ba3\u8a00\"", "shape": "dot", "size": 10, "source_id": "chunk-d755fab09b5a7aa586cb34ff284a4bed"}, {"color": "#deb0a0", "description": "\"Capitalism is an economic system that was criticized by Karl Marx for its effects on workers and society.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"CAPITALISM\"", "label": "\"CAPITALISM\"", "shape": "dot", "size": 10, "source_id": "chunk-d755fab09b5a7aa586cb34ff284a4bed"}, {"color": "#dbaaac", "description": "\"London Police Department has been criticized for using a tool called \u0027gang matrix\u0027\"", "entity_type": "\"LOCATION\"", "id": "\"\u4f26\u6566\u8b66\u5bdf\u5385\"", "label": "\"\u4f26\u6566\u8b66\u5bdf\u5385\"", "shape": "dot", "size": 10, "source_id": "chunk-e2e8a6dc1f92dd71bac35c96a9b17431"}, {"color": "#a3417a", "description": "\"Gang Matrix system is widely regarded as racist and discriminatory, with potential biases in its predictive formulas.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"\u5e2e\u6d3e\u77e9\u9635\"", "label": "\"\u5e2e\u6d3e\u77e9\u9635\"", "shape": "dot", "size": 10, "source_id": "chunk-e2e8a6dc1f92dd71bac35c96a9b17431"}, {"color": "#b51bd3", "description": "\"PredPol is a company that sells software for predictive policing.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"PREDPOL\"", "label": "\"PREDPOL\"", "shape": "dot", "size": 10, "source_id": "chunk-e2e8a6dc1f92dd71bac35c96a9b17431"}, {"color": "#026c82", "description": "\"PredPol is a company that sells software for predictive policing.\"", "entity_type": "\"ORGANIZATION\"", "id": "\" PREDPOL \"", "label": "\" PREDPOL \"", "shape": "dot", "size": 10, "source_id": "chunk-e2e8a6dc1f92dd71bac35c96a9b17431"}, {"color": "#a589dd", "description": "\"PredPol\u0027s software has been used by law enforcement agencies for predictive policing.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"PREDPOL \"", "label": "\"PREDPOL \"", "shape": "dot", "size": 10, "source_id": "chunk-e2e8a6dc1f92dd71bac35c96a9b17431"}, {"color": "#c2ea0a", "description": "\"COMPAS is a risk assessment tool used in sentencing decisions.\"", "entity_type": "\"ORGANIZATION\"", "id": "\"COMPAS\"", "label": "\"COMPAS\"", "shape": "dot", "size": 10, "source_id": "chunk-e2e8a6dc1f92dd71bac35c96a9b17431"}, {"color": "#7                   // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  
                      network.on("stabilizationProgress", function(params) {
                          document.getElementById('loadingBar').removeAttribute("style");
                          var maxWidth = 496;
                          var minWidth = 20;
                          var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
